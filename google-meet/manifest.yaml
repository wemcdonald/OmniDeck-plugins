id: google-meet
name: "Google Meet"
version: "1.0.0"
description: |
  Control Google Meet calls from your deck. Toggle mute, camera, hand raise,
  captions, leave call, toggle chat, and send emoji reactions.

  Requires the companion Chrome extension — download it from the plugin
  settings page and load it as an unpacked extension in Chrome.
hub: hub.ts
agent: agent.ts
downloads:
  - name: chrome-extension
    label: "Chrome Extension"
    path: extension/
    description: "Load as unpacked extension in Chrome (chrome://extensions → Load unpacked)"
icon: ms:videocam
category: Communication
setup_steps:
  - "Download and install the companion Chrome extension using the button below"
  - "In Chrome, go to `chrome://extensions`, enable Developer Mode, click Load unpacked, and select the downloaded extension folder"
  - "Join a Google Meet call — OmniDeck will detect it automatically"
source_url: "https://github.com/wemcdonald/OmniDeck-plugins"
